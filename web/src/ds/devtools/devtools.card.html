<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-1);font-family:var(--font-ui);color:var(--text-2);padding:20px}
  .lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:0 0 12px}
  .sec{margin-bottom:22px}
</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { LogConsole, ControlBar } = window.ContrEDesignSystem_9c78ea;
function Demo(){
  const [playing,setPlaying]=React.useState(false);
  const [speed,setSpeed]=React.useState(2);
  const [b,setB]=React.useState(400);
  const [a,setA]=React.useState(700);
  return <>
    <div className="sec"><p className="lab">ControlBar</p>
      <ControlBar playing={playing} speed={speed} delayBefore={b} delayAfter={a}
        onTogglePlay={()=>setPlaying(p=>!p)} onStep={()=>{}} onSpeed={setSpeed}
        onDelayBefore={setB} onDelayAfter={setA} />
    </div>
    <div className="sec"><p className="lab">LogConsole</p>
      <div style={{height:240}}>
        <LogConsole defaultHidden={['trace']} entries={[
          {ts:'12:04:01',level:'info',msg:'donne 4 — distribution 3-2-3'},
          {ts:'12:04:01',level:'debug',msg:'eval main Sud = 0.71 · atout ♥'},
          {ts:'12:04:01',level:'warning',msg:'annonce capot à risque (concentration 0.4)'},
          {ts:'12:04:02',level:'info',msg:'pli 3 remporté par Sud (R♥)'},
          {ts:'12:04:02',level:'error',msg:'contrat non rempli — équipe A · −160'},
          {ts:'12:04:02',level:'trace',msg:'ws → state.tick #482'},
        ]} />
      </div>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
