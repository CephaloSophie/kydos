<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-1);font-family:var(--font-ui);color:var(--text-2);padding:20px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:640px}
  .lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:0 0 10px}
</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, Select, Slider, Switch } = window.ContrEDesignSystem_9c78ea;
function Demo(){
  const [agr,setAgr]=React.useState(0.72);
  const [spd,setSpd]=React.useState(2);
  const [conv,setConv]=React.useState('classique');
  const [on,setOn]=React.useState(true);
  return <div className="cols">
    <div>
      <p className="lab">Input</p>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Input label="Nom du robot" defaultValue="Iznogoud" />
        <Input label="Email" type="email" error="Adresse déjà utilisée" defaultValue="cap@ot.fr" />
      </div>
      <p className="lab" style={{marginTop:20}}>Select & Switch</p>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Select label="Convention d'enchères" value={conv} onChange={setConv}
          options={[{value:'classique',label:'Classique'},{value:'soft',label:'Soft'},{value:'aggressive',label:'Agressive'}]} />
        <Switch checked={on} onChange={setOn} label="Robot actif" />
      </div>
    </div>
    <div>
      <p className="lab">Slider</p>
      <div style={{display:'flex',flexDirection:'column',gap:18}}>
        <Slider label="Agressivité" value={agr} min={0} max={1} onChange={setAgr} format={v=>v.toFixed(2)} />
        <Slider label="Concentration" value={0.5} min={0} max={1} onChange={()=>{}} format={v=>v.toFixed(2)} />
        <Slider label="Vitesse de partie" value={spd} min={0.25} max={12} step={0.25} onChange={setSpd} format={v=>`${v}×`} accent="var(--spark)" />
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
