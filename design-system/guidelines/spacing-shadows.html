<!-- @dsCard group="Spacing" viewport="700x170" name="Ombres & lueurs" subtitle="élévation 1→3, pop + lueur atout/gagnant" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-1);font-family:var(--font-ui);padding:24px 18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .b{display:flex;flex-direction:column;align-items:center;gap:10px}
  .sq{width:80px;height:54px;background:var(--bg-2);border-radius:var(--r-md);border:1px solid var(--border-1)}
  .b span{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)}
</style></head><body>
  <div class="b"><div class="sq" style="box-shadow:var(--shadow-1)"></div><span>shadow-1</span></div>
  <div class="b"><div class="sq" style="box-shadow:var(--shadow-2)"></div><span>shadow-2</span></div>
  <div class="b"><div class="sq" style="box-shadow:var(--shadow-3)"></div><span>shadow-3</span></div>
  <div class="b"><div class="sq" style="box-shadow:var(--shadow-pop)"></div><span>pop</span></div>
  <div class="b"><div class="sq" style="box-shadow:var(--glow-accent)"></div><span>glow-accent</span></div>
  <div class="b"><div class="sq" style="box-shadow:var(--glow-win)"></div><span>glow-win</span></div>
</body></html>
