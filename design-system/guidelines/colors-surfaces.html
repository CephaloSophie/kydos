<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="5 niveaux de fond, du canvas au overlay" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-1);font-family:var(--font-ui);color:var(--text-2);padding:18px}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-1);height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
  .sw b{font-size:12px;color:var(--text-1);font-weight:600}
  .sw span{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--bg-0)"><b>bg-0</b><span>#0b0d10</span></div>
    <div class="sw" style="background:var(--bg-1)"><b>bg-1</b><span>#0f1115</span></div>
    <div class="sw" style="background:var(--bg-2)"><b>bg-2</b><span>#161922</span></div>
    <div class="sw" style="background:var(--bg-3)"><b>bg-3</b><span>#1d2230</span></div>
    <div class="sw" style="background:var(--bg-4)"><b>bg-4</b><span>#272d3d</span></div>
    <div class="sw" style="background:var(--bg-inset)"><b>inset</b><span>#0a0c0f</span></div>
  </div>
</body></html>
