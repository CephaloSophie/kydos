<!-- @dsCard group="Spacing" viewport="700x150" name="Rayons" subtitle="xs 4 → 2xl 28 + full" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-1);font-family:var(--font-ui);padding:18px;display:flex;gap:14px;align-items:center}
  .b{display:flex;flex-direction:column;align-items:center;gap:8px}
  .sq{width:64px;height:64px;background:var(--bg-3);border:1px solid var(--border-2);border-top:2px solid var(--accent)}
  .b span{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)}
</style></head><body>
  <div class="b"><div class="sq" style="border-radius:var(--r-xs)"></div><span>xs · 4</span></div>
  <div class="b"><div class="sq" style="border-radius:var(--r-sm)"></div><span>sm · 6</span></div>
  <div class="b"><div class="sq" style="border-radius:var(--r-md)"></div><span>md · 10</span></div>
  <div class="b"><div class="sq" style="border-radius:var(--r-lg)"></div><span>lg · 14</span></div>
  <div class="b"><div class="sq" style="border-radius:var(--r-xl)"></div><span>xl · 20</span></div>
  <div class="b"><div class="sq" style="border-radius:var(--r-2xl)"></div><span>2xl · 28</span></div>
  <div class="b"><div class="sq" style="border-radius:var(--r-full)"></div><span>full</span></div>
</body></html>
