<!-- @dsCard group="Colors" viewport="700x180" name="Tapis & cartes" subtitle="felt vert, face de carte, rouge/noir, dos" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-1);font-family:var(--font-ui);padding:18px;display:flex;gap:16px;align-items:center}
  .felt{flex:1;height:120px;border-radius:var(--r-lg);background:radial-gradient(120% 120% at 50% 40%, var(--felt-bright), var(--felt) 55%, var(--felt-edge));border:3px solid var(--felt-rail);display:grid;place-items:center;color:#cfeede;font-size:12px;letter-spacing:.06em}
  .cards{display:flex;gap:10px}
  .pc{width:62px;height:88px;border-radius:var(--r-card);background:var(--card-face);box-shadow:var(--shadow-2);display:flex;align-items:flex-start;justify-content:flex-start;padding:7px;font-family:var(--font-display);font-weight:700;font-size:20px}
  .red{color:var(--card-red)} .black{color:var(--card-black)}
  .back{background:repeating-linear-gradient(45deg,var(--card-back),var(--card-back) 5px,var(--card-back-line) 5px,var(--card-back-line) 10px);border:3px solid var(--card-face)}
</style></head><body>
  <div class="felt">TAPIS · --felt</div>
  <div class="cards">
    <div class="pc red">A♥</div>
    <div class="pc black">10♠</div>
    <div class="pc back"></div>
  </div>
</body></html>
