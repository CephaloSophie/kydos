<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-1);font-family:var(--font-ui);padding:16px 18px;color:var(--text-1)}
  .r{display:flex;align-items:baseline;gap:14px;padding:3px 0}
  .r .tok{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);width:120px}
  .display{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1}
  .h1{font-family:var(--font-display);font-size:28px;font-weight:600}
  .h2{font-size:22px;font-weight:700}
  .h3{font-size:18px;font-weight:600}
  .body{font-size:15px} .sm{font-size:13px;color:var(--text-2)} .xs{font-size:11px;color:var(--text-3)}
</style></head><body>
  <div class="r"><span class="tok">--fs-display 40</span><span class="display">Atout</span></div>
  <div class="r"><span class="tok">--fs-h1 28</span><span class="h1">Mon équipe</span></div>
  <div class="r"><span class="tok">--fs-h2 22</span><span class="h2">Tournois actifs</span></div>
  <div class="r"><span class="tok">--fs-h3 18</span><span class="h3">Robots du joueur</span></div>
  <div class="r"><span class="tok">--fs-body 15</span><span class="body">Corps de texte courant</span></div>
  <div class="r"><span class="tok">--fs-sm 13</span><span class="sm">Légende secondaire</span></div>
  <div class="r"><span class="tok">--fs-xs 11</span><span class="xs">LABEL EN CAPITALES</span></div>
</body></html>
